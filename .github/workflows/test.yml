name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # ghcr.io/getindiekit/indiekit:beta is not published yet (the image
      # itself is still getindiekit/indiekit#960, an open PR) — pin to that
      # PR's branch head and build it ourselves, the same way compose.local.yml
      # tells a person to. Swap this for a `docker pull` once it's published;
      # skipping the Docker-dependent checks instead is not an option — a
      # skipped security check is worse than a red one.
      - uses: actions/checkout@v4
        with:
          repository: getindiekit/indiekit
          ref: 0b3b35466711f4c6d898a6700b423b44dacaeb2a
          path: indiekit-image-source

      - run: docker build -t indiekit:local indiekit-image-source

      - run: COMPOSE_FILE=compose.yml:compose.local.yml node test/kit.mjs

      - run: docker build -f site.Dockerfile -t site:check .

      - name: check site image is under 400 MB
        run: |
          size=$(docker image inspect site:check --format '{{.Size}}')
          echo "site:check image size: ${size} bytes"
          test "$size" -lt $((400 * 1000 * 1000))

      - name: build the site inside the image
        # --entrypoint: the image's entrypoint is the watcher, which would
        # build once and then wait on inotifywait forever, ignoring the command.
        run: |
          docker run --rm --entrypoint sh -e SITE_URL=http://localhost -e SPEEDLIFY_OFFLINE=1 -v "$PWD/site.json:/config/site.json:ro" site:check -c 'printf "{\"url\":\"http://localhost\",\"indiekit\":\"http://localhost\"}" > /tmp/u.json; SITE_FIXTURE=/config/site.json,/tmp/u.json NPM_DOWNLOADS_OFFLINE=1 npx @11ty/eleventy --quiet --output=/tmp/out && test -f /tmp/out/index.html'
