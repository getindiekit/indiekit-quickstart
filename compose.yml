services:
  indiekit:
    image: ghcr.io/getindiekit/indiekit:beta
    restart: unless-stopped
    user: "${UID_GID:-1000:1000}"
    volumes:
      - ./indiekit.config.js:/app/indiekit.config.js:ro
      - ./content:/app/content
    environment:
      PUBLICATION_URL: ${SITE_URL}
      MONGO_URL: mongodb://mongo:27017/indiekit
      SECRET: ${SECRET}
      PASSWORD_SECRET: ${PASSWORD_SECRET:-}
      # Optional. Each syndicator loads only when its credentials are set
      # (indiekit.config.js); webmention.io sync needs its token.
      INDIEKIT_LOCALE: ${INDIEKIT_LOCALE:-}
      WEBMENTION_IO_TOKEN: ${WEBMENTION_IO_TOKEN:-}
      BLUESKY_HANDLE: ${BLUESKY_HANDLE:-}
      BLUESKY_PASSWORD: ${BLUESKY_PASSWORD:-}
      MASTODON_URL: ${MASTODON_URL:-}
      MASTODON_USER: ${MASTODON_USER:-}
      MASTODON_ACCESS_TOKEN: ${MASTODON_ACCESS_TOKEN:-}
      INTERNET_ARCHIVE_ACCESS_KEY: ${INTERNET_ARCHIVE_ACCESS_KEY:-}
      INTERNET_ARCHIVE_SECRET_KEY: ${INTERNET_ARCHIVE_SECRET_KEY:-}
    # Sign-in makes the server fetch its own public address. From inside the
    # container that address must reach this machine's Caddy, not the
    # container itself (localhost) and not depend on the network hairpinning
    # back in; mapping the host name to the Docker host does both.
    extra_hosts:
      - "${SITE_HOST:-quickstart.localhost}:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  site:
    build:
      context: .
      dockerfile: site.Dockerfile
    restart: unless-stopped
    user: "${UID_GID:-1000:1000}"
    volumes:
      # The theme's content/ is both its Eleventy source and its post store,
      # so the store is mounted one post directory at a time: the theme's own
      # templates stay, your posts and uploads come from ./content.
      - ./content/articles:/site/content/articles
      - ./content/bookmarks:/site/content/bookmarks
      - ./content/likes:/site/content/likes
      - ./content/notes:/site/content/notes
      - ./content/photos:/site/content/photos
      - ./content/replies:/site/content/replies
      - ./content/pages:/site/content/pages
      - ./content/audio:/site/content/audio
      - ./content/events:/site/content/events
      - ./content/jams:/site/content/jams
      - ./content/reposts:/site/content/reposts
      - ./content/rsvps:/site/content/rsvps
      - ./content/videos:/site/content/videos
      - ./content/media:/site/content/media
      - ./site.json:/config/site.json:ro
      - built:/site/_site
    environment:
      SITE_URL: ${SITE_URL}
      THEME_SAMPLE_POSTS: "0"
      DEMO: ${DEMO:-0}
      NPM_DOWNLOADS_OFFLINE: "1"
      SPEEDLIFY_OFFLINE: "1"
      NODE_ENV: production

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - built:/srv/site:ro
      - ./content:/srv/content:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_URL: ${SITE_URL}
    depends_on:
      - indiekit
      - site

volumes:
  mongo:
  built:
  caddy_data:
  caddy_config:
